name: CLIP CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_gpu:
        description: Build Dockerfile.gpu (hosted runners have no NVIDIA runtime)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  cpu-validate:
    name: CPU tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-ara \
            fonts-dejavu-core \
            libgomp1
          tesseract --list-langs

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify zxingcpp import
        run: python -c "import zxingcpp; print('zxingcpp', getattr(zxingcpp, '__version__', 'ok'))"

      - name: Run security and static checks
        run: python scripts/ci_static_checks.py

      - name: Generate ephemeral internal JWT secret
        run: |
          python - <<'PY'
          import os
          import secrets
          secret = secrets.token_urlsafe(48)
          if len(secret.encode("utf-8")) < 32:
              raise SystemExit("generated INTERNAL_JWT_SECRET is shorter than 32 bytes")
          print(f"::add-mask::{secret}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"INTERNAL_JWT_SECRET={secret}\n")
          print("generated ephemeral INTERNAL_JWT_SECRET (>=32 bytes)")
          PY

      - name: Run Python tests
        env:
          INFERENCE_DEVICE: cpu
          STORAGE_MODE: memory
          ENV: test
          OCR_ENABLED: "true"
          OCR_LANGUAGES: eng+ara
          RATE_LIMIT_PER_MINUTE: "10000"
        run: |
          set -euo pipefail
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
          status=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          import pathlib
          import re
          import sys
          log = pathlib.Path("unittest.log").read_text(errors="replace")
          ran = re.search(r"^Ran (\d+) tests? in ", log, re.M)
          if not ran:
              print("CLIP_TEST_TOTALS parse_error", file=sys.stderr)
              raise SystemExit(1)
          skipped = 0
          failed = 0
          errors = 0
          summary = re.search(r"^(OK|FAILED)(?: \((.*)\))?$", log, re.M)
          if summary and summary.group(2):
              parts = dict(
                  item.strip().split("=", 1)
                  for item in summary.group(2).split(",")
                  if "=" in item
              )
              skipped = int(parts.get("skipped", 0))
              failed = int(parts.get("failures", 0))
              errors = int(parts.get("errors", 0))
          print(
              f"CLIP_TEST_TOTALS ran={ran.group(1)} failed={failed} errors={errors} skipped={skipped}"
          )
          if summary is None or summary.group(1) != "OK" or failed or errors:
              raise SystemExit(1)
          PY
          exit "$status"

      - name: Upload unittest log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clip-unittest-log
          path: unittest.log
          if-no-files-found: warn
          retention-days: 14

  cpu-image:
    name: CPU Docker image gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate ephemeral internal JWT secret
        run: |
          python3 - <<'PY'
          import os
          import secrets
          secret = secrets.token_urlsafe(48)
          if len(secret.encode("utf-8")) < 32:
              raise SystemExit("generated INTERNAL_JWT_SECRET is shorter than 32 bytes")
          print(f"::add-mask::{secret}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"INTERNAL_JWT_SECRET={secret}\n")
          print("generated ephemeral INTERNAL_JWT_SECRET (>=32 bytes)")
          PY

      - name: Build Dockerfile.cpu
        run: docker build -f Dockerfile.cpu -t clip-service:ci-cpu .

      - name: Start MongoDB test dependency
        run: |
          set -euo pipefail
          docker network create clip-ci
          docker run -d --name clip-mongo --network clip-ci --network-alias mongo mongo:7.0
          for attempt in $(seq 1 30); do
            if docker exec clip-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              echo "MongoDB is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become ready" >&2
          docker logs clip-mongo
          exit 1

      - name: Start CLIP CPU test container
        run: |
          docker run -d --name clip-cpu --network clip-ci -p 8080:8080 \
            -e ENV=ci \
            -e INFERENCE_DEVICE=cpu \
            -e STORAGE_MODE=mongodb \
            -e MONGODB_URI=mongodb://mongo:27017 \
            -e MONGODB_DB=clip_ci \
            -e INTERNAL_JWT_SECRET \
            -e OCR_ENABLED=true \
            -e OCR_LANGUAGES=eng+ara \
            -e RATE_LIMIT_PER_MINUTE=1000 \
            -e HF_HUB_DISABLE_TELEMETRY=1 \
            clip-service:ci-cpu

      - name: Wait for /health/live
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health/live; then
              echo
              echo "liveness is up"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' clip-cpu 2>/dev/null || true)" != "true" ]; then
              echo "CLIP container exited before liveness" >&2
              docker logs clip-cpu
              exit 1
            fi
            sleep 5
          done
          echo "timed out waiting for /health/live" >&2
          docker logs clip-cpu
          exit 1

      - name: Wait for Mongo-backed /health/ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            body="$(curl -sS http://127.0.0.1:8080/health/ready || true)"
            echo "$body"
            if echo "$body" | python3 -c "import json,sys; payload=json.load(sys.stdin); raise SystemExit(0 if payload.get('status')=='ready' and (payload.get('checks') or {}).get('databaseReady') else 1)"; then
              echo "readiness is up"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' clip-cpu 2>/dev/null || true)" != "true" ]; then
              echo "CLIP container exited before readiness" >&2
              docker logs clip-cpu
              exit 1
            fi
            sleep 5
          done
          echo "timed out waiting for /health/ready" >&2
          docker logs clip-cpu
          exit 1

      - name: Validate OCR, barcode, and embedding-free responses
        run: docker exec -w /app -e PYTHONPATH=/app -e CLIP_BASE_URL=http://127.0.0.1:8080 clip-cpu python /app/scripts/ci_cpu_smoke.py

      - name: Capture container logs on failure
        if: failure()
        run: |
          docker logs clip-cpu || true
          docker logs clip-mongo || true

  gpu-image:
    name: GPU image (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_gpu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Dockerfile.gpu
        run: docker build -f Dockerfile.gpu -t clip-service:ci-gpu .

      - name: Skip GPU runtime checks
        run: |
          echo "Hosted GitHub runners do not provide an NVIDIA runtime."
          echo "Dockerfile.gpu build completed; runtime GPU validation is manual."
